server:
  port: 8082

spring:
  application:
    name: finance-account-service

  data:
    mongodb:
      uri: ${MONGODB_URI_ACCOUNTS}
      database: finance_accounts

app:
  jwt:
    secret: ${JWT_SECRET}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info