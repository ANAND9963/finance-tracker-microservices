server:
  port: 8080

spring:
  application:
    name: finance-api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://finance-auth-service
              predicates:
                - Path=/api/auth/**

            - id: account-service
              uri: lb://finance-account-service
              predicates:
                - Path=/api/accounts/**,/api/categories/**

            - id: transaction-service
              uri: lb://finance-transaction-service
              predicates:
                - Path=/api/transactions/**

          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:3000"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway